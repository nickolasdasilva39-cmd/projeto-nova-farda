<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farda Nova | Modalidades</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html"><span>FARDA</span> NOVA</a>
        <a class="back-link" href="index.html">← Início</a>
    </header>

    <main class="form-page">
        <section class="form-container">
            <div class="section-heading">
                <span class="tag">ETAPA 2</span>
                <h1>Modalidades de alistamento</h1>
                <p>Escolha uma opção para continuar na simulação.</p>
            </div>

            <div class="option-grid">
                <button class="option-card" data-option="Alistamento feminino">
                    <span>01</span>
                    <h2>Alistamento feminino</h2>
                    <p>Informações e direcionamento para esta modalidade.</p>
                </button>
                <button class="option-card" data-option="Alistamento masculino">
                    <span>02</span>
                    <h2>Alistamento masculino</h2>
                    <p>Informações e direcionamento para esta modalidade.</p>
                </button>
                <button class="option-card" data-option="Moro no exterior">
                    <span>03</span>
                    <h2>Moro no exterior</h2>
                    <p>Orientações para cidadãos que residem fora do Brasil.</p>
                </button>
                <button class="option-card" data-option="Problemas de saúde">
                    <span>04</span>
                    <h2>Problemas de saúde</h2>
                    <p>Área destinada a informações relacionadas à saúde.</p>
                </button>
            </div>

            <div class="result-box" id="optionResult">
                <h3>Selecione uma modalidade</h3>
                <p>A opção escolhida aparecerá aqui.</p>
            </div>

            <a class="btn btn-secondary center-btn" href="index.html">Voltar ao início</a>
        </section>
    </main>

    <footer>
        <p>Farda Nova &copy; 2026 — Projeto acadêmico</p>
    </footer>

    <script src="../js/script.js"></script>
</body>
</html>
