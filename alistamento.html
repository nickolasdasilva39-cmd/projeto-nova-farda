<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farda Nova | Requisição de Kit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html"><span>FARDA</span> NOVA</a>
        <a class="back-link" href="index.html">← Início</a>
    </header>

    <main class="form-page">
        <section class="form-container">
            <div class="section-heading">
                <span class="tag">ETAPA 2</span>
                <h1>Requisição de Fardamento</h1>
                <p>Selecione o kit adequado à função do colaborador.</p>
            </div>

            <div class="option-grid">
                <button class="option-card" data-option="Kit Vigilância Patrimonial">
                    <span>01</span>
                    <h2>Vigilância Patrimonial</h2>
                    <p>Camisa social, calça tática, coturno e jaqueta de frio.</p>
                </button>
                <button class="option-card" data-option="Kit Escolta Armada">
                    <span>02</span>
                    <h2>Escolta Armada</h2>
                    <p>Fardamento tático completo, colete balístico e cinto de guarnição.</p>
                </button>
                <button class="option-card" data-option="Kit Administrativo">
                    <span>03</span>
                    <h2>Setor Administrativo</h2>
                    <p>Camisa polo corporativa, calça social e crachá.</p>
                </button>
                <button class="option-card" data-option="Kit Serviços Gerais">
                    <span>04</span>
                    <h2>Serviços Gerais</h2>
                    <p>Uniforme brim antichama, bota de segurança (EPI) e luvas.</p>
                </button>
            </div>

            <div class="result-box" id="optionResult">
                <h3>Selecione um Kit de Fardamento</h3>
                <p>A opção escolhida aparecerá aqui.</p>
            </div>

            <a class="btn btn-secondary center-btn" href="index.html">Finalizar Requisição</a>
        </section>
    </main>

    <footer>
        <p>Farda Nova &copy; 2026 — Projeto Acadêmico Front-End</p>
    </footer>

    <script src="../js/script.js"></script>
</body>
</html>
