<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farda Nova | Serviços</title>
    <link rel="stylesheet" href="style.css">
    
</head>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html"><span>FARDA</span> NOVA</a>
        <a class="back-link" href="index.html">← Início</a>
    </header>

    <main class="form-page">
        <section class="form-container">
            <div class="section-heading">
                <span class="tag">ÁREA DO CIDADÃO</span>
                <h1>Já me alistei</h1>
                <p>Escolha o serviço que deseja consultar na simulação.</p>
            </div>

            <div class="option-grid">
                <button class="option-card" data-service="Acompanhar Alistamento">
                    <span>01</span>
                    <h2>Acompanhar Alistamento</h2>
                    <p>Consultar o andamento do processo.</p>
                </button>
                <button class="option-card" data-service="Locais de atendimento">
                    <span>02</span>
                    <h2>Locais de atendimento</h2>
                    <p>Consultar informações sobre atendimento.</p>
                </button>
                <button class="option-card" data-service="Solicitar certificado de dispensa">
                    <span>03</span>
                    <h2>Solicitar certificado de dispensa</h2>
                    <p>Opção para quem ainda não possui o certificado.</p>
                </button>
                <button class="option-card" data-service="Certificados Militares">
                    <span>04</span>
                    <h2>Certificados Militares</h2>
                    <p>Área para quem já possui certificados.</p>
                </button>
                <button class="option-card" data-service="Validar certificado">
                    <span>05</span>
                    <h2>Validar certificado</h2>
                    <p>Área destinada à validação de certificado.</p>
                </button>
            </div>

            <div class="result-box" id="serviceResult">
                <h3>Selecione um serviço</h3>
                <p>O serviço escolhido aparecerá aqui.</p>
            </div>

            <a class="btn btn-secondary center-btn" href="index.html">Voltar ao início</a>
        </section>
    </main>

    <footer>
        <p>Farda Nova &copy; 2026 — Projeto acadêmico</p>
    </footer>

   <script src="script.js"></script>
</body>
</html>
