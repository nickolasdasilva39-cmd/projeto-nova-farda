<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farda Nova | Portal do Colaborador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html"><span>FARDA</span> NOVA</a>
        <a class="back-link" href="index.html">← Início</a>
    </header>

    <main class="form-page">
        <section class="form-container">
            <div class="section-heading">
                <span class="tag">ÁREA DO FUNCIONÁRIO</span>
                <h1>Portal do Colaborador</h1>
                <p>Acompanhe requisições de fardamento e agende trocas.</p>
            </div>

            <div class="option-grid">
                <button class="option-card" data-service="Acompanhar Requisição">
                    <span>01</span>
                    <h2>Acompanhar Requisição</h2>
                    <p>Veja se seu kit de fardamento já está pronto para retirada.</p>
                </button>
                <button class="option-card" data-service="Solicitar Troca de Peça">
                    <span>02</span>
                    <h2>Solicitar Troca de Peça</h2>
                    <p>Agende a substituição de uma peça danificada ou de tamanho incorreto.</p>
                </button>
                <button class="option-card" data-service="Manual de Uso">
                    <span>03</span>
                    <h2>Manual de Uso</h2>
                    <p>Diretrizes de limpeza e conservação dos EPIs.</p>
                </button>
                <button class="option-card" data-service="Termo de Responsabilidade">
                    <span>04</span>
                    <h2>Termo de Responsabilidade</h2>
                    <p>Consulte ou assine digitalmente seu termo de recebimento.</p>
                </button>
            </div>

            <div class="result-box" id="serviceResult">
                <h3>Selecione um serviço corporativo</h3>
                <p>O serviço escolhido aparecerá aqui.</p>
            </div>

            <a class="btn btn-secondary center-btn" href="index.html">Sair do Sistema</a>
        </section>
    </main>

    <footer>
        <p>Farda Nova &copy; 2026 — Projeto Acadêmico Front-End</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
